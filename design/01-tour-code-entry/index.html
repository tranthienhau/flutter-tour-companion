<script>
        // Simple input formatting script to auto-insert hyphen if needed
        document.getElementById('tour-code').addEventListener('input', function(e) {
            let val = e.target.value.replace(/-/g, '').toUpperCase();
            if (val.length > 3) {
                val = val.substring(0, 3) + '-' + val.substring(3);
            }
            e.target.value = val;
        });
    </script>
